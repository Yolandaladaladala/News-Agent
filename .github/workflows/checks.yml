name: Static checks and editorial tests
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q app.py free_research.py agent_workflow.py model_gateway.py
      - name: Editorial unit tests
        run: python -m unittest discover -s tests -v
